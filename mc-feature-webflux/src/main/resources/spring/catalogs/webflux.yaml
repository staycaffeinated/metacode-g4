# WebFlux feature catalog.
# All entries carry 'when: flavor: [webflux]'.
# Feature-gated entries add 'features:' conditions on top.
# Endpoint-scope entries are below the project-scope section.
# Base scaffold (Application.java, app.yml, etc.) comes from mc-core-springboot.

entries:

  # ─── Project scope: always renders for webflux ───────────────────────────────

  - scope: project
    archetype: WebFluxConfiguration
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/config/WebFluxConfiguration.ftl

  - scope: project
    archetype: ApplicationConfiguration
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/config/ApplicationConfiguration.ftl

  - scope: project
    archetype: ObjectMapperConfiguration
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/config/ObjectMapperConfiguration.ftl

  - scope: project
    archetype: DateTimeFormatConfiguration
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/config/DateTimeFormatConfiguration.ftl

  - scope: project
    archetype: GlobalExceptionHandler
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/advice/GlobalExceptionHandler.ftl
      - facet: test
        sourceTemplate: /spring/templates/webflux/test/advice/GlobalExceptionHandlerTests.ftl

  - scope: project
    archetype: SecurityResponseHeadersFilter
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/filter/SecurityResponseHeadersWebFilter.ftl

  - scope: project
    archetype: RootController
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/endpoint-root/RootController.ftl
      - facet: test
        sourceTemplate: /spring/templates/webflux/test/endpoint-root/RootControllerTest.ftl
      - facet: integrationTest
        sourceTemplate: /spring/templates/webflux/integrationTest/endpoint-root/RootControllerIT.ftl
        destination: "{{integrationTestBasePackagePath}}/adapter/inbound/web/home/RootControllerIT.java"

  - scope: project
    archetype: RootService
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/endpoint-root/RootService.ftl
      - facet: test
        sourceTemplate: /spring/templates/webflux/test/endpoint-root/RootServiceTest.ftl

  - scope: project
    archetype: AbstractDataStoreApi
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/spi/DataStore.ftl

  - scope: project
    archetype: ResourceIdSupplier
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/spi/ResourceIdSupplier.ftl

  - scope: project
    archetype: SecureRandomSeries
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/math/SecureRandomSeries.ftl

  - scope: project
    archetype: ResourceIdFormat
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/domain/ResourceIdFormat.ftl

  - scope: project
    archetype: ResourceIdTrait
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/trait/ResourceIdTrait.ftl

  - scope: project
    archetype: UpdateAwareConverter
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/trait/UpdateAwareConverter.ftl

  - scope: project
    archetype: UnprocessableEntityException
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/exception/UnprocessableEntityException.ftl

  - scope: project
    archetype: ResourceNotFoundException
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/exception/ResourceNotFoundException.ftl

  - scope: project
    archetype: BadRequestException
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/exception/BadRequestException.ftl

  - scope: project
    archetype: ContainerConfiguration
    when:
      flavor: [webflux]
    facets:
      - facet: integrationTest
        sourceTemplate: /spring/templates/webflux/integrationTest/config/ContainerConfiguration.ftl

  - scope: project
    archetype: Architecture
    when:
      flavor: [webflux]
    facets:
      - facet: test
        sourceTemplate: /spring/templates/webflux/test/ArchitectureTest.ftl

  - scope: project
    archetype: AlphabeticAnnotation
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webmvc/main/adapter/in/web/validation/Alphabetic.ftl

  - scope: project
    archetype: AlphabeticValidator
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webmvc/main/adapter/in/web/validation/AlphabeticValidator.ftl
      - facet: test
        sourceTemplate: /spring/templates/webmvc/test/adapter/in/web/validation/AlphabeticValidatorTest.ftl

  - scope: project
    archetype: ResourceIdAnnotation
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webmvc/main/adapter/in/web/validation/ResourceId.ftl

  - scope: project
    archetype: ResourceIdValidator
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webmvc/main/adapter/in/web/validation/ResourceIdValidator.ftl
      - facet: test
        sourceTemplate: /spring/templates/webmvc/test/adapter/in/web/validation/ResourceIdValidatorTest.ftl

  - scope: project
    archetype: SearchTextAnnotation
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webmvc/main/adapter/in/web/validation/SearchText.ftl

  - scope: project
    archetype: SearchTextValidator
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webmvc/main/adapter/in/web/validation/SearchTextValidator.ftl
      - facet: test
        sourceTemplate: /spring/templates/webmvc/test/adapter/in/web/validation/SearchTextValidatorTest.ftl

  - scope: project
    archetype: OnCreateAnnotation
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webmvc/main/validation/OnCreate.ftl

  - scope: project
    archetype: OnUpdateAnnotation
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webmvc/main/validation/OnUpdate.ftl

  - scope: project
    archetype: ResourceIdentity
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/common/ResourceIdentity.ftl

  # ─── Project scope: postgres ─────────────────────────────────────────────────

  - scope: project
    archetype: AbstractPostgresIntegrationTest
    when:
      flavor: [webflux]
      features: [postgres]
    facets:
      - facet: integrationTest
        sourceTemplate: /spring/templates/webflux/integrationTest/common/AbstractPostgresIntegrationTest.ftl

  - scope: project
    archetype: PostgresDbContainerTests
    when:
      flavor: [webflux]
      features: [postgres, testcontainers]
    facets:
      - facet: integrationTest
        sourceTemplate: /spring/templates/webflux/integrationTest/common/PostgresContainerTest.ftl

  - scope: project
    archetype: RegisterDatabaseProperties
    when:
      flavor: [webflux]
    facets:
      - facet: integrationTest
        sourceTemplate: /spring/templates/webflux/integrationTest/database/RegisterDatabaseProperties.ftl

  - scope: project
    archetype: Text
    when:
      flavor: [webflux]
      features: [postgres]
    facets:
      - facet: integrationTest
        sourceTemplate: /spring/templates/webflux/integrationTest/resources/CreateSchemaDotSql.ftl
        destination: "{{appModule}}/src/integrationTest/resources/db/scripts/01-create-schema.sql"

  # ─── Project scope: liquibase (implies postgres) ─────────────────────────────

  - scope: project
    archetype: Text
    when:
      flavor: [webflux]
      features: [postgres, liquibase]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/resources/db/liquibase/db.changelog-master.ftl
        destination: "{{appModule}}/src/main/resources/db/changelog/db.changelog-master.yaml"
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/resources/db/liquibase/db.changelog-001-create-schema.ftl
        destination: "{{appModule}}/src/main/resources/db/changelog/db.changelog-001-create-schema.sql"

  # ─── Project scope: flyway (implies postgres) ────────────────────────────────

  - scope: project
    archetype: Text
    when:
      flavor: [webflux]
      features: [postgres, flyway]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/resources/db/flyway/create-schema.ftl
        destination: "{{appModule}}/src/main/resources/db/migration/V0001__create-schema.sql"

  # ─── Endpoint scope ──────────────────────────────────────────────────────────

  - scope: endpoint
    archetype: Routes
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/endpoint/EntityRoutes.ftl
        destination: "{{basePackagePath}}/adapter/inbound/web/{{lowerCaseEntityName}}/{{entityName}}Routes.java"

  - scope: endpoint
    archetype: Controller
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/endpoint/RestController.ftl
        destination: "{{basePackagePath}}/adapter/inbound/web/{{lowerCaseEntityName}}/{{entityName}}Controller.java"
      - facet: test
        sourceTemplate: /spring/templates/webflux/test/endpoint/ControllerTests.ftl
        destination: "{{testBasePackagePath}}/adapter/inbound/web/{{lowerCaseEntityName}}/{{entityName}}ControllerTests.java"
      - facet: integrationTest
        sourceTemplate: /spring/templates/webflux/integrationTest/endpoint/ControllerIT.ftl
        destination: "{{integrationTestBasePackagePath}}/adapter/inbound/web/{{lowerCaseEntityName}}/{{entityName}}ControllerIT.java"

  - scope: endpoint
    archetype: ServiceApi
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/endpoint/ReactiveServiceUseCase.ftl
        destination: "{{basePackagePath}}/application/port/inbound/{{lowerCaseEntityName}}/{{entityName}}ServiceUseCase.java"

  - scope: endpoint
    archetype: ServiceImpl
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/endpoint/RestServiceProvider.ftl
        destination: "{{basePackagePath}}/application/service/{{entityName}}ServiceProvider.java"
      - facet: test
        sourceTemplate: /spring/templates/webflux/test/endpoint/ServiceTests.ftl
        destination: "{{testBasePackagePath}}/application/service/{{entityName}}ServiceTests.java"

  - scope: endpoint
    archetype: Entity
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/database/entity/Entity.ftl
        destination: "{{basePackagePath}}/adapter/outbound/persistence/{{lowerCaseEntityName}}/{{entityName}}.java"
      - facet: test
        sourceTemplate: /spring/templates/webflux/test/database/EntityTests.ftl
        destination: "{{testBasePackagePath}}/adapter/outbound/persistence/{{lowerCaseEntityName}}/{{entityName}}Tests.java"

  - scope: endpoint
    archetype: Repository
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/database/entity/Repository.ftl
        destination: "{{basePackagePath}}/adapter/outbound/persistence/{{lowerCaseEntityName}}/{{entityName}}Repository.java"
      - facet: integrationTest
        sourceTemplate: /spring/templates/webflux/integrationTest/database/endpoint/RepositoryIT.ftl
        destination: "{{integrationTestBasePackagePath}}/adapter/outbound/persistence/{{lowerCaseEntityName}}/{{entityName}}RepositoryIT.java"

  - scope: endpoint
    archetype: EntityResource
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/domain/EntityResource.ftl
        destination: "{{basePackagePath}}/domain/{{entityName}}Resource.java"

  - scope: endpoint
    archetype: ConcreteDataStoreApi
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/database/entity/ReactiveDataStore.ftl
        destination: "{{basePackagePath}}/application/port/outbound/{{lowerCaseEntityName}}/{{entityName}}DataStore.java"

  - scope: endpoint
    archetype: ConcreteDataStoreImpl
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/database/entity/ReactiveDataStoreProvider.ftl
        destination: "{{basePackagePath}}/adapter/outbound/persistence/{{lowerCaseEntityName}}/{{entityName}}DataStoreProvider.java"

  - scope: endpoint
    archetype: EntityRequest
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/adapter/in/web/EntityRequest.ftl
        destination: "{{basePackagePath}}/adapter/inbound/web/{{lowerCaseEntityName}}/{{entityName}}Request.java"
      - facet: test
        sourceTemplate: /spring/templates/webflux/test/adapter/in/web/EntityRequestTest.ftl
        destination: "{{testBasePackagePath}}/adapter/inbound/web/{{lowerCaseEntityName}}/{{entityName}}RequestTest.java"

  - scope: endpoint
    archetype: EntityResponse
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/adapter/in/web/EntityResponse.ftl
        destination: "{{basePackagePath}}/adapter/inbound/web/{{lowerCaseEntityName}}/{{entityName}}Response.java"
      - facet: test
        sourceTemplate: /spring/templates/webflux/test/adapter/in/web/EntityResponseTest.ftl
        destination: "{{testBasePackagePath}}/adapter/inbound/web/{{lowerCaseEntityName}}/{{entityName}}ResponseTest.java"

  - scope: endpoint
    archetype: PojoToEntityConverter
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/database/converter/PojoToEntityConverter.ftl
        destination: "{{basePackagePath}}/adapter/outbound/persistence/{{lowerCaseEntityName}}/converter/{{entityName}}PojoToEntityConverter.java"
      - facet: test
        sourceTemplate: /spring/templates/webflux/test/database/converter/PojoToEntityConverterTests.ftl
        destination: "{{testBasePackagePath}}/adapter/outbound/persistence/{{lowerCaseEntityName}}/converter/{{entityName}}PojoToEntityConverterTests.java"

  - scope: endpoint
    archetype: EntityToPojoConverter
    when:
      flavor: [webflux]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/database/converter/EntityToPojoConverter.ftl
        destination: "{{basePackagePath}}/adapter/outbound/persistence/{{lowerCaseEntityName}}/converter/{{entityName}}ToPojoConverter.java"
      - facet: test
        sourceTemplate: /spring/templates/webflux/test/database/converter/EntityToPojoConverterTests.ftl
        destination: "{{testBasePackagePath}}/adapter/outbound/persistence/{{lowerCaseEntityName}}/converter/{{entityName}}ToPojoConverterTests.java"

  - scope: endpoint
    archetype: EjbTestFixtures
    when:
      flavor: [webflux]
    facets:
      - facet: testFixtures
        sourceTemplate: /spring/templates/webmvc/testFixtures/endpoint/EjbTestFixtures.ftl
        destination: "{{testFixturesBasePackagePath}}/adapter/outbound/persistence/{{lowerCaseEntityName}}/{{entityName}}Fixtures.java"

  - scope: endpoint
    archetype: ModelTestFixtures
    when:
      flavor: [webflux]
    facets:
      - facet: testFixtures
        sourceTemplate: /spring/templates/webflux/testFixtures/endpoint/ModelTestFixtures.ftl
        destination: "{{testFixturesBasePackagePath}}/adapter/inbound/web/{{lowerCaseEntityName}}/{{entityName}}ModelFixtures.java"

  - scope: endpoint
    archetype: TestTableInitializer
    when:
      flavor: [webflux]
    facets:
      - facet: integrationTest
        sourceTemplate: /spring/templates/webflux/integrationTest/database/endpoint/TestTableInitializer.ftl
        destination: "{{integrationTestBasePackagePath}}/adapter/outbound/persistence/{{lowerCaseEntityName}}/{{entityName}}TestTableInitializer.java"

  - scope: endpoint
    archetype: Text
    when:
      flavor: [webflux]
    facets:
      - facet: integrationTest
        sourceTemplate: /spring/templates/webflux/integrationTest/resources/H2CreateSchemaDotSql.ftl
        destination: "{{appModule}}/src/integrationTest/resources/database/{{lowerCaseEntityName}}-schema.sql"

  - scope: endpoint
    archetype: Text
    when:
      flavor: [webflux]
      features: [postgres, testcontainers]
    facets:
      - facet: integrationTest
        sourceTemplate: /spring/templates/webflux/integrationTest/resources/PostgresCreateTableSql.ftl
        destination: "{{appModule}}/src/integrationTest/resources/create-schema.sql"

  - scope: endpoint
    archetype: Text
    when:
      flavor: [webflux]
      features: [flyway]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/webflux/main/resources/db/flyway/create-table.ftl
        destination: "{{appModule}}/src/main/resources/db/migration/{{createTableScriptName}}"
