  - scope: project
    archetype: Text
    when:
      flavor: [webmvc, webflux, springbatch, springboot]
    facets:
      - facet: main
        sourceTemplate: /spring/templates/gradle/application/BuildDotGradle.ftl
        destination: "{{appModule}}/build.gradle"

  - scope: project
    archetype: Text
    when:
