pluginManagement {
    includeBuild("./gradle/settings")
}

plugins {
    id "buildlogic.repositories"
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'metacode-g4'

include "mc-core"
include "mc-core-springboot"
include "mc-feature-webmvc"
include "mc-feature-webflux"
include "mc-feature-springbatch"
include "mc-feature-javaapp"
include "mc-application"
