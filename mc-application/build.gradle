plugins {
    id 'buildlogic.application-conventions'
    id 'jacoco-report-aggregation'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.dependency.management)
    alias(libs.plugins.versions)
    alias(libs.plugins.lombok.plugin)

}

dependencies {
    annotationProcessor libs.picocli.codegen

    implementation project(':mc-core')
    implementation project(':mc-core-springboot')
    implementation project(':mc-feature-webmvc')
    implementation project(':mc-feature-webflux')
    implementation project(':mc-feature-springbatch')
    implementation project(':mc-feature-javaapp')
    implementation libs.commonsIo
    implementation libs.picocli.spring.boot.starter

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.junit.jupiter
}

application {
    mainClass = 'mmm.coffee.metacode.Application'
    applicationName = 'metacode'
}

tasks.named('bootJar') {
    archiveBaseName = application.applicationName
    manifest.attributes['Implementation-Title'] = 'MetaCode'
    manifest.attributes['Implementation-Version'] = archiveVersion.getOrElse('0.1')
}

tasks.register('stage', Exec) {
    group = 'Verification'
    description = 'Copy the jar to a staging area for end-to-end testing'
    workingDir = file('.')
    commandLine 'bash', './stageIt.sh'
}

jib {
    dockerClient {
        executable = project.findProperty('dockerExecutable') ?: '/usr/local/bin/docker'
    }
    from {
        image = 'eclipse-temurin:21-jre-jammy'
        platforms {
            platform {
                os = 'linux'
                architecture = 'arm64'
           }
           platform {
                os = 'linux'
                architecture = 'amd64'
           }
        }
    }
    to {
        image = 'metacode'
        tags = [ 'latest', version ]
    }
    container {
        format = 'OCI'
    }
}


def ignoredClasses =
            "**/*Exception.java"        +
            ",**/*Configuration.java"   +
            ",**/cli/**.java"           +
            ",**/Application.java"

sonar {
    properties {
        property "sonar.projectName", "metacode"
        property "sonar.projectKey", "metacode"
        property "sonar.gradle.skipCompile", "true"
        property "sonar.coverage.exclusions", ignoredClasses
    }
}
